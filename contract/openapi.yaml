openapi: 3.0.3
info:
  title: CodeJam 16 API
  version: 0.2.3
  description: |
    Single source of truth for every request and response shape between the frontend and the backend.
    Rules and the reasons behind them live in `api-contract.md` (same folder).
    Any change here → bump `info.version`, update `api-contract.md` if a rule changed, and tell the whole team.

    Conventions
    - JSON everywhere, keys in snake_case.
    - Times are ISO 8601 with offset. The server's clock is the only clock.
    - Coordinates are always named `{ lat, lng }`, never arrays. Montreal `lng` is negative.
    - Every error uses the `Error` schema; the frontend switches on `error.code`.

servers:
  - url: http://localhost:8000/api
    description: Local Laravel backend
  - url: http://localhost:4010
    description: Prism mock server (npx @stoplight/prism-cli mock contract/openapi.yaml)

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: me
  - name: zones
  - name: events
  - name: exchange
  - name: host
  - name: leaderboard

paths:
  /register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account (role is chosen here and never changes)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in and get a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current token
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current user, points and zone progress
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/exchanges:
    get:
      operationId: getMyExchanges
      tags: [me]
      summary: Completed exchanges involving the caller since a given time (poll every 5 s)
      parameters:
        - name: since
          in: query
          required: false
          description: Return exchanges with completed_at after this time. Omit to get the last 20. Use the previous response's server_time.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: New exchanges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeExchanges'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /zones:
    get:
      operationId: getZones
      tags: [zones]
      summary: The fixed 10×10 grid with required counts and bonuses (fetch once at startup)
      responses:
        '200':
          description: The grid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zones'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: All events that have not ended (map pins)
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createEvent
      tags: [events]
      summary: Create an event (host only). The server computes zone_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '422':
          description: OUTSIDE_GRID or VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                outsideGrid:
                  value:
                    error:
                      code: OUTSIDE_GRID
                      message: This location is outside the map grid.
                validation:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: Some fields are invalid.
                      fields:
                        ends_at: [ends_at must be after starts_at.]

  /events/{id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getEvent
      tags: [events]
      summary: Event detail sheet (poll every 5 s while open)
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{id}/rsvp:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: rsvp
      tags: [events]
      summary: I'm going (attendee only, idempotent). Returns the code if the window is open.
      responses:
        '200':
          description: Going
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RsvpResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: EVENT_ENDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EVENT_ENDED
                  message: This event has ended.
    delete:
      operationId: cancelRsvp
      tags: [events]
      summary: Cancel going (allowed until the first completed exchange at this event)
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelRsvpResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: NOT_GOING or FORBIDDEN_ROLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_GOING
                  message: You are not going to this event.
        '409':
          description: CANNOT_CANCEL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CANNOT_CANCEL
                  message: You already met someone here, so you can't cancel.

  /events/{id}/exchange:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: exchangeCode
      tags: [exchange]
      summary: Enter another attendee's code. Completes only when both have entered each other's code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
      responses:
        '200':
          description: Pending (waiting for the partner) or completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeResponse'
              examples:
                pending:
                  value:
                    status: pending
                    partner: { id: 7, name: Ana }
                completed:
                  value:
                    status: completed
                    partner: { id: 7, name: Ana }
                    points_gained: 300
                    zone:
                      zone_id: 45
                      exchange_count: 1
                      required_count: 1
                      unlocked: true
                      unlocked_now: true
                    total_points: 820
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: FORBIDDEN_ROLE or NOT_GOING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_GOING
                  message: Press I'm going first.
        '404':
          description: INVALID_CODE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CODE
                  message: No one at this event has that code.
        '409':
          description: ALREADY_EXCHANGED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ALREADY_EXCHANGED
                  message: You already met this person at this event.
        '422':
          description: OWN_CODE or CODE_WINDOW_CLOSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: OWN_CODE
                  message: That's your own code.

  /host/events:
    get:
      operationId: listHostEvents
      tags: [host]
      summary: Events created by the calling host, with counts
      responses:
        '200':
          description: The host's events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HostEventSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: All-time top 20 attendees plus the caller's own row
      responses:
        '200':
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token

  parameters:
    EventId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        example: 12

  responses:
    Unauthenticated:
      description: UNAUTHENTICATED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: Please log in.
    ForbiddenRole:
      description: FORBIDDEN_ROLE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN_ROLE
              message: Your account type can't do this.
    NotFound:
      description: Event not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Event not found.
    ValidationFailed:
      description: VALIDATION_FAILED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_FAILED
              message: Some fields are invalid.
              fields:
                email: [The email has already been taken.]

  schemas:
    # ---------- shared ----------
    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN_ROLE
        - NOT_GOING
        - NOT_FOUND
        - INVALID_CODE
        - OWN_CODE
        - ALREADY_EXCHANGED
        - CODE_WINDOW_CLOSED
        - EVENT_ENDED
        - CANNOT_CANCEL
        - OUTSIDE_GRID
        - VALIDATION_FAILED

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            fields:
              type: object
              description: Only for VALIDATION_FAILED. Field name → messages.
              additionalProperties:
                type: array
                items:
                  type: string

    Role:
      type: string
      enum: [host, attendee]

    CodeWindow:
      type: string
      description: "before: now < starts_at − 3h · open: starts_at − 3h ≤ now ≤ ends_at · closed: now > ends_at (DEMO_MODE → always open)"
      enum: [before, open, closed]
      example: open

    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, example: 7 }
        name: { type: string, example: Ana }

    Bounds:
      type: object
      required: [south, west, north, east]
      properties:
        south: { type: number, format: double, example: 45.496 }
        west: { type: number, format: double, example: -73.59 }
        north: { type: number, format: double, example: 45.51 }
        east: { type: number, format: double, example: -73.572 }

    # ---------- auth ----------
    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 50, example: Tak }
        email: { type: string, format: email, example: tak@example.com }
        password: { type: string, minLength: 8, example: password123 }
        role:
          $ref: '#/components/schemas/Role'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: tak@example.com }
        password: { type: string, example: password123 }

    User:
      type: object
      required: [id, name, role, points]
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, example: Tak }
        role:
          $ref: '#/components/schemas/Role'
        points: { type: integer, example: 520 }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, example: 1|abcdefghijklmnopqrstuvwxyz }
        user:
          $ref: '#/components/schemas/User'

    # ---------- me ----------
    ZoneProgress:
      type: object
      required: [zone_id, exchange_count, required_count, unlocked]
      properties:
        zone_id: { type: integer, minimum: 0, maximum: 99, example: 45 }
        exchange_count: { type: integer, example: 2 }
        required_count: { type: integer, minimum: 1, maximum: 5, example: 1 }
        unlocked: { type: boolean, example: true }

    Me:
      type: object
      required: [id, name, role, points, zone_progress]
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, example: Tak }
        role:
          $ref: '#/components/schemas/Role'
        points: { type: integer, example: 520 }
        zone_progress:
          type: array
          description: Only zones with exchange_count > 0. Empty for hosts.
          items:
            $ref: '#/components/schemas/ZoneProgress'

    ExchangeSummary:
      type: object
      required: [id, event, partner, completed_at, points_gained, zone_id, unlocked_now]
      properties:
        id: { type: integer, example: 31 }
        event:
          type: object
          required: [id, title]
          properties:
            id: { type: integer, example: 12 }
            title: { type: string, example: Board Game Night }
        partner:
          $ref: '#/components/schemas/PersonRef'
        completed_at: { type: string, format: date-time, example: '2026-11-21T21:05:03-05:00' }
        points_gained:
          type: integer
          description: From the caller's side (100, plus the bonus if this exchange unlocked the zone for the caller)
          example: 300
        zone_id: { type: integer, example: 45 }
        unlocked_now:
          type: boolean
          description: Whether this exchange unlocked the zone for the caller
          example: true

    MeExchanges:
      type: object
      required: [server_time, exchanges]
      properties:
        server_time:
          type: string
          format: date-time
          description: Use as the next `since`
          example: '2026-11-21T21:05:12-05:00'
        exchanges:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeSummary'

    # ---------- zones ----------
    ZoneCell:
      type: object
      required: [id, row, col, bounds, required_count, bonus_points]
      properties:
        id: { type: integer, minimum: 0, maximum: 99, example: 45 }
        row: { type: integer, minimum: 0, maximum: 9, example: 4 }
        col: { type: integer, minimum: 0, maximum: 9, example: 5 }
        bounds:
          $ref: '#/components/schemas/Bounds'
        required_count: { type: integer, minimum: 1, maximum: 5, example: 1 }
        bonus_points: { type: integer, example: 200 }

    Zones:
      type: object
      required: [bounds, rows, cols, cells]
      properties:
        bounds:
          allOf:
            - $ref: '#/components/schemas/Bounds'
          example: { south: 45.44, west: -73.68, north: 45.58, east: -73.5 }
        rows: { type: integer, example: 10 }
        cols: { type: integer, example: 10 }
        cells:
          type: array
          minItems: 100
          maxItems: 100
          items:
            $ref: '#/components/schemas/ZoneCell'

    # ---------- events ----------
    EventSummary:
      type: object
      required: [id, title, location_name, lat, lng, zone_id, starts_at, ends_at, code_window, going_count, is_going, host]
      properties:
        id: { type: integer, example: 12 }
        title: { type: string, example: Board Game Night }
        location_name: { type: string, example: Trottier Lobby }
        lat: { type: number, format: double, example: 45.507 }
        lng: { type: number, format: double, example: -73.579 }
        zone_id: { type: integer, minimum: 0, maximum: 99, example: 45 }
        starts_at: { type: string, format: date-time, example: '2026-11-21T20:00:00-05:00' }
        ends_at: { type: string, format: date-time, example: '2026-11-21T23:00:00-05:00' }
        code_window:
          $ref: '#/components/schemas/CodeWindow'
        going_count: { type: integer, example: 8 }
        is_going: { type: boolean, example: true }
        host:
          $ref: '#/components/schemas/PersonRef'

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          required: [description, address, code_available_at, my_code, can_cancel, pending_from, people_met_here]
          properties:
            description: { type: string, example: Bring a friend or come alone. Games provided. }
            address:
              type: string
              nullable: true
              description: Display only. Null when the host placed the pin by tapping the map.
              example: 3630 Rue University
            code_available_at:
              type: string
              format: date-time
              description: starts_at − 3h
              example: '2026-11-21T17:00:00-05:00'
            my_code:
              type: string
              nullable: true
              pattern: '^[0-9]{4}$'
              description: Non-null only when the caller is going and code_window is open
              example: '4821'
            can_cancel:
              type: boolean
              description: True while going and no completed exchange at this event
              example: false
            pending_from:
              type: array
              description: People who entered the caller's code and are waiting for the caller to enter theirs
              items:
                $ref: '#/components/schemas/PersonRef'
            people_met_here:
              type: array
              items:
                $ref: '#/components/schemas/PersonRef'

    EventCreateRequest:
      type: object
      required: [title, location_name, lat, lng, starts_at, ends_at]
      properties:
        title: { type: string, minLength: 1, maxLength: 80, example: Board Game Night }
        description: { type: string, maxLength: 500, example: Bring a friend or come alone. }
        location_name: { type: string, minLength: 1, maxLength: 120, example: Trottier Lobby }
        address:
          type: string
          nullable: true
          maxLength: 200
          description: Optional; empty when the pin was placed by tapping the map
          example: 3630 Rue University
        lat:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          description: |
            Must be > 0 (else VALIDATION_FAILED: lat and lng were probably swapped).
            Grid range 45.44–45.58 is NOT a field-validation rule: a valid number outside the grid
            returns OUTSIDE_GRID from the server's grid check.
          example: 45.507
        lng:
          type: number
          format: double
          exclusiveMaximum: true
          maximum: 0
          description: |
            Must be < 0 (else VALIDATION_FAILED: Montreal longitude is always negative).
            Grid range -73.68 to -73.50 is NOT a field-validation rule: a valid number outside the grid
            returns OUTSIDE_GRID from the server's grid check.
          example: -73.579
        starts_at:
          type: string
          format: date-time
          description: Must be after now
          example: '2026-11-21T20:00:00-05:00'
        ends_at:
          type: string
          format: date-time
          description: After starts_at, at most 12 h later
          example: '2026-11-21T23:00:00-05:00'

    HostEventSummary:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          required: [completed_exchange_count]
          properties:
            completed_exchange_count: { type: integer, example: 14 }

    RsvpResponse:
      type: object
      required: [going_count, code_window, my_code]
      properties:
        going_count: { type: integer, example: 9 }
        code_window:
          $ref: '#/components/schemas/CodeWindow'
        my_code:
          type: string
          nullable: true
          pattern: '^[0-9]{4}$'
          example: '4821'

    CancelRsvpResponse:
      type: object
      required: [going_count]
      properties:
        going_count: { type: integer, example: 8 }

    # ---------- exchange ----------
    ExchangeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{4}$'
          example: '5930'

    ExchangePending:
      type: object
      required: [status, partner]
      properties:
        status:
          type: string
          enum: [pending]
        partner:
          $ref: '#/components/schemas/PersonRef'

    ZoneResult:
      type: object
      required: [zone_id, exchange_count, required_count, unlocked, unlocked_now]
      properties:
        zone_id: { type: integer, example: 45 }
        exchange_count: { type: integer, example: 1 }
        required_count: { type: integer, example: 1 }
        unlocked: { type: boolean, example: true }
        unlocked_now: { type: boolean, example: true }

    ExchangeCompleted:
      type: object
      required: [status, partner, points_gained, zone, total_points]
      properties:
        status:
          type: string
          enum: [completed]
        partner:
          $ref: '#/components/schemas/PersonRef'
        points_gained: { type: integer, example: 300 }
        zone:
          $ref: '#/components/schemas/ZoneResult'
        total_points: { type: integer, example: 820 }

    ExchangeResponse:
      oneOf:
        - $ref: '#/components/schemas/ExchangePending'
        - $ref: '#/components/schemas/ExchangeCompleted'
      discriminator:
        propertyName: status
        mapping:
          pending: '#/components/schemas/ExchangePending'
          completed: '#/components/schemas/ExchangeCompleted'

    # ---------- leaderboard ----------
    LeaderboardEntry:
      type: object
      required: [rank, user_id, name, points]
      properties:
        rank: { type: integer, description: 'Ties share a rank (1, 1, 3)', example: 1 }
        user_id: { type: integer, example: 9 }
        name: { type: string, example: Léa }
        points: { type: integer, example: 3400 }

    Leaderboard:
      type: object
      required: [top, me]
      properties:
        top:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        me:
          type: object
          allOf:
            - $ref: '#/components/schemas/LeaderboardEntry'
          nullable: true
          description: Null for hosts
